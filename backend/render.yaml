services:
  - type: web
    name: niyamgraph-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://niyamgraph.vercel.app
      - key: DOCS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ALLOWED_FILE_EXTENSIONS
        value: pdf,png,jpg,jpeg
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_ALGORITHM
        value: HS256
      # Sensitive secrets below marked sync: false (configured manually in Render Dashboard)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false

